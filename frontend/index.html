<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .status-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }
        
        .status-item .label {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .status-item .value {
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .status-item.cpu .value { color: #ff6b6b; }
        .status-item.ram .value { color: #4ecdc4; }
        .status-item.hosts .value { color: #ffe66d; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .chart-container h3 {
            margin-bottom: 15px;
            color: #00d4ff;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .connection-status.connected {
            background: #2ecc71;
            color: #fff;
        }
        
        .connection-status.disconnected {
            background: #e74c3c;
            color: #fff;
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="connectionStatus" class="connection-status disconnected">Disconnected</div>
    
    <div class="container">
        <header>
            <h1>🖥️ System Monitoring Dashboard</h1>
            <p>Real-time CPU & RAM Monitoring</p>
        </header>
        
        <div class="status-bar">
            <div class="status-item cpu">
                <div class="label">CPU Usage</div>
                <div class="value" id="currentCPU">--%</div>
            </div>
            <div class="status-item ram">
                <div class="label">RAM Usage</div>
                <div class="value" id="currentRAM">--%</div>
            </div>
            <div class="status-item hosts">
                <div class="label">Active Hosts</div>
                <div class="value" id="activeHosts">0</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <h3>📊 CPU Usage Over Time</h3>
                <canvas id="cpuChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>💾 RAM Usage Over Time</h3>
                <canvas id="ramChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SYSTEM MONITORING DASHBOARD
        // ==========================================
        
        // Configuration
        const CONFIG = {
            wsURL: 'ws://localhost:8080/ws',
            apiURL: 'http://localhost:8080/api/history',
            maxDataPoints: 60,  // Số điểm dữ liệu tối đa trên biểu đồ
            reconnectInterval: 3000, // Thời gian chờ trước khi reconnect (ms)
        };

        // State
        let cpuChart, ramChart;
        let ws = null;
        let reconnectTimer = null;

        // ==========================================
        // CHART INITIALIZATION
        // ==========================================
        
        function initCharts() {
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 300,
                    easing: 'easeInOutQuart'
                },
                scales: {
                    x: {
                        display: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#aaa',
                            maxRotation: 45
                        }
                    },
                    y: {
                        min: 0,
                        max: 100,
                        display: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#aaa',
                            callback: function(value) {
                                return value + '%';
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            color: '#fff'
                        }
                    }
                }
            };

            // CPU Chart
            const cpuCtx = document.getElementById('cpuChart').getContext('2d');
            cpuChart = new Chart(cpuCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'CPU Usage (%)',
                        data: [],
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 2,
                        pointHoverRadius: 5
                    }]
                },
                options: chartOptions
            });

            // RAM Chart
            const ramCtx = document.getElementById('ramChart').getContext('2d');
            ramChart = new Chart(ramCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'RAM Usage (%)',
                        data: [],
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78, 205, 196, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 2,
                        pointHoverRadius: 5
                    }]
                },
                options: chartOptions
            });
        }

        // ==========================================
        // CHART UPDATE FUNCTIONS
        // ==========================================
        
        function updateCharts(metric) {
            const now = new Date().toLocaleTimeString();

            // Update CPU Chart
            cpuChart.data.labels.push(now);
            cpuChart.data.datasets[0].data.push(metric.cpu_usage);
            
            // Keep only maxDataPoints
            if (cpuChart.data.labels.length > CONFIG.maxDataPoints) {
                cpuChart.data.labels.shift();
                cpuChart.data.datasets[0].data.shift();
            }
            cpuChart.update('none'); // 'none' for performance

            // Update RAM Chart
            ramChart.data.labels.push(now);
            ramChart.data.datasets[0].data.push(metric.ram_usage_percent);
            
            if (ramChart.data.labels.length > CONFIG.maxDataPoints) {
                ramChart.data.labels.shift();
                ramChart.data.datasets[0].data.shift();
            }
            ramChart.update('none');

            // Update status bar
            document.getElementById('currentCPU').textContent = metric.cpu_usage.toFixed(1) + '%';
            document.getElementById('currentRAM').textContent = metric.ram_usage_percent.toFixed(1) + '%';
        }

        // ==========================================
        // WEBSOCKET CONNECTION
        // ==========================================
        
        function connectWebSocket() {
            const statusEl = document.getElementById('connectionStatus');
            
            ws = new WebSocket(CONFIG.wsURL);

            ws.onopen = function() {
                console.log('WebSocket connected');
                statusEl.textContent = 'Connected';
                statusEl.className = 'connection-status connected';
                
                // Clear reconnect timer if exists
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = function(event) {
                try {
                    const metric = JSON.parse(event.data);
                    updateCharts(metric);
                    
                    // Track unique hosts
                    if (metric.hostname) {
                        updateActiveHosts(metric.hostname);
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket disconnected');
                statusEl.textContent = 'Disconnected - Reconnecting...';
                statusEl.className = 'connection-status disconnected';
                
                // Auto reconnect
                reconnectTimer = setTimeout(connectWebSocket, CONFIG.reconnectInterval);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        // ==========================================
        // ACTIVE HOSTS TRACKING
        // ==========================================
        
        const activeHosts = new Set();
        
        function updateActiveHosts(hostname) {
            activeHosts.add(hostname);
            document.getElementById('activeHosts').textContent = activeHosts.size;
        }

        // ==========================================
        // LOAD HISTORICAL DATA
        // ==========================================
        
        async function loadHistory() {
            try {
                const response = await fetch(`${CONFIG.apiURL}?limit=60`);
                if (!response.ok) throw new Error('Failed to fetch history');
                
                const metrics = await response.json();
                
                // Initialize charts with historical data
                metrics.forEach(metric => {
                    const time = new Date(metric.timestamp).toLocaleTimeString();
                    
                    cpuChart.data.labels.push(time);
                    cpuChart.data.datasets[0].data.push(metric.cpu_usage);
                    
                    ramChart.data.labels.push(time);
                    ramChart.data.datasets[0].data.push(metric.ram_usage_percent);
                    
                    if (metric.hostname) {
                        updateActiveHosts(metric.hostname);
                    }
                });
                
                cpuChart.update();
                ramChart.update();
                
                // Update current values
                if (metrics.length > 0) {
                    const latest = metrics[metrics.length - 1];
                    document.getElementById('currentCPU').textContent = latest.cpu_usage.toFixed(1) + '%';
                    document.getElementById('currentRAM').textContent = latest.ram_usage_percent.toFixed(1) + '%';
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            loadHistory();
            connectWebSocket();
        });
    </script>
</body>
</html>
