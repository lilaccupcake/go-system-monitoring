<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Monitor — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #38bdf8;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --purple: #a78bfa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Background blobs */
    body::before, body::after {
      content:''; position:fixed; border-radius:50%; filter:blur(120px); z-index:0; pointer-events:none;
    }
    body::before { width:600px; height:600px; background:rgba(56,189,248,0.07); top:-200px; left:-200px; }
    body::after  { width:500px; height:500px; background:rgba(167,139,250,0.07); bottom:-150px; right:-150px; }

    /* ── LAYOUT ── */
    .app { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh; }

    /* ── TOPBAR ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 28px;
      background:rgba(255,255,255,0.03);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(20px);
      position:sticky; top:0; z-index:100;
    }
    .topbar-brand { display:flex; align-items:center; gap:10px; }
    .topbar-brand .logo { font-size:1.4rem; }
    .topbar-brand h1 { font-size:1.05rem; font-weight:600; letter-spacing:.3px; }
    .topbar-brand h1 span { color:var(--accent); }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .ws-badge {
      display:flex; align-items:center; gap:6px;
      padding:5px 14px; border-radius:20px; font-size:.78rem; font-weight:500;
      border:1px solid var(--border); transition:.3s;
    }
    .ws-badge.connected    { border-color:var(--green); color:var(--green); }
    .ws-badge.disconnected { border-color:var(--red); color:var(--red); }
    .ws-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .ws-badge.connected .ws-dot { animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── MAIN ── */
    .main { padding:24px 28px; display:flex; flex-direction:column; gap:24px; }

    /* ── STAT CARDS ── */
    .stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
    .stat-card {
      background:var(--surface); border:1px solid var(--border); border-radius:16px;
      padding:18px 20px; display:flex; flex-direction:column; gap:6px;
      transition:transform .2s, border-color .2s;
    }
    .stat-card:hover { transform:translateY(-2px); border-color:rgba(255,255,255,0.16); }
    .stat-card .s-label { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
    .stat-card .s-value { font-size:2rem; font-weight:700; line-height:1; }
    .stat-card .s-sub   { font-size:.72rem; color:var(--muted); }
    .c-blue   { color:var(--accent)!important; }
    .c-green  { color:var(--green)!important; }
    .c-yellow { color:var(--yellow)!important; }
    .c-purple { color:var(--purple)!important; }
    .c-red    { color:var(--red)!important; }

    /* ── SECTION HEADER ── */
    .section-header {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
    }
    .section-title { font-size:.85rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }

    /* ── HOST FILTER ── */
    .filter-select {
      background:var(--surface2); border:1px solid var(--border); color:var(--text);
      padding:6px 12px; border-radius:8px; font-size:.8rem; font-family:inherit; cursor:pointer;
    }
    .filter-select:focus { outline:none; border-color:var(--accent); }

    /* ── HOST CARDS ── */
    .host-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
    .host-card {
      background:var(--surface); border:1px solid var(--border); border-radius:16px;
      padding:18px 20px; transition:transform .2s, border-color .2s;
    }
    .host-card:hover { transform:translateY(-2px); border-color:rgba(255,255,255,0.14); }
    .host-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .host-name { font-size:.9rem; font-weight:600; display:flex; align-items:center; gap:8px; }
    .host-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .host-time { font-size:.7rem; color:var(--muted); }
    .meter-row { display:flex; flex-direction:column; gap:10px; }
    .meter { display:flex; flex-direction:column; gap:5px; }
    .meter-top { display:flex; justify-content:space-between; font-size:.75rem; }
    .meter-label { color:var(--muted); }
    .meter-val   { font-weight:600; }
    .meter-bar   { height:6px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; }
    .meter-fill  { height:100%; border-radius:99px; transition:width .4s ease; }
    .meter-fill.cpu { background:linear-gradient(90deg,#38bdf8,#818cf8); }
    .meter-fill.ram { background:linear-gradient(90deg,#34d399,#a78bfa); }

    /* ── CHARTS ── */
    .charts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(520px,1fr)); gap:14px; }
    .chart-card {
      background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px;
    }
    .chart-card h3 { font-size:.85rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:14px; }
    canvas { max-height:220px; }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column:1/-1; text-align:center; padding:60px 20px;
      color:var(--muted); font-size:.9rem;
    }
    .empty-state .icon { font-size:2.5rem; margin-bottom:10px; }

    /* ── RESPONSIVE ── */
    @media(max-width:768px) {
      .topbar { padding:12px 16px; }
      .main   { padding:16px; }
      .charts-grid { grid-template-columns:1fr; }
      .stat-row { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <nav class="topbar">
    <div class="topbar-brand">
      <span class="logo">🖥️</span>
      <h1>System <span>Monitor</span></h1>
    </div>
    <div class="topbar-right">
      <div id="wsBadge" class="ws-badge disconnected">
        <div class="ws-dot"></div>
        <span id="wsText">Disconnected</span>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">

    <!-- STAT CARDS -->
    <div class="stat-row">
      <div class="stat-card">
        <div class="s-label">Active Hosts</div>
        <div class="s-value c-yellow" id="statHosts">0</div>
        <div class="s-sub">machines connected</div>
      </div>
      <div class="stat-card">
        <div class="s-label">Avg CPU</div>
        <div class="s-value c-blue" id="statCPU">--%</div>
        <div class="s-sub">across all hosts</div>
      </div>
      <div class="stat-card">
        <div class="s-label">Avg RAM</div>
        <div class="s-value c-green" id="statRAM">--%</div>
        <div class="s-sub">across all hosts</div>
      </div>
      <div class="stat-card">
        <div class="s-label">Data Points</div>
        <div class="s-value c-purple" id="statPoints">0</div>
        <div class="s-sub">metrics received</div>
      </div>
    </div>

    <!-- HOST CARDS -->
    <div>
      <div class="section-header">
        <span class="section-title">📡 Live Hosts</span>
        <select class="filter-select" id="hostFilter">
          <option value="all">All Hosts</option>
        </select>
      </div>
      <div class="host-grid" id="hostGrid">
        <div class="empty-state">
          <div class="icon">📭</div>
          <div>Waiting for agents to connect...</div>
        </div>
      </div>
    </div>

    <!-- CHARTS -->
    <div>
      <div class="section-header">
        <span class="section-title">📈 History (last 60 points)</span>
      </div>
      <div class="charts-grid">
        <div class="chart-card">
          <h3>⚡ CPU Usage %</h3>
          <canvas id="cpuChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>💾 RAM Usage %</h3>
          <canvas id="ramChart"></canvas>
        </div>
      </div>
    </div>

  </div><!-- /main -->
</div><!-- /app -->

<script>
// ── CONFIG ──────────────────────────────────────
const WS_URL  = `ws://${location.host}/ws`;
const API_URL = `${location.protocol}//${location.host}/api/history`;
const MAX_PTS = 60;

// ── STATE ───────────────────────────────────────
let ws = null, reconnectTimer = null;
let totalPoints = 0;
let selectedHost = 'all';

// hostState[hostname] = { cpu, ram, ramTotal, ramUsed, lastSeen, color }
const hostState = {};
const hostDatasets = {}; // { cpu: dataset, ram: dataset }

const PALETTE = [
  '#38bdf8','#34d399','#fbbf24','#a78bfa','#f87171',
  '#fb923c','#e879f9','#4ade80','#f472b6','#60a5fa'
];
let colorIdx = 0;
function getColor(h) {
  if (!hostState[h]) {
    hostState[h] = { color: PALETTE[colorIdx++ % PALETTE.length] };
  }
  return hostState[h].color;
}

// ── CHART INIT ──────────────────────────────────
const baseOpts = {
  responsive:true, maintainAspectRatio:false,
  animation:{ duration:200 },
  interaction:{ mode:'index', intersect:false },
  scales:{
    x:{ grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#64748b', maxTicksLimit:8, maxRotation:0} },
    y:{ min:0, max:100, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{ color:'#64748b', callback:v=>v+'%' } }
  },
  plugins:{
    legend:{ labels:{ color:'#94a3b8', boxWidth:12, padding:16, font:{size:11} } },
    tooltip:{
      backgroundColor:'rgba(15,23,42,0.95)', borderColor:'rgba(255,255,255,0.08)', borderWidth:1,
      titleColor:'#e2e8f0', bodyColor:'#94a3b8', padding:10,
      callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%` }
    }
  }
};

const cpuChart = new Chart(document.getElementById('cpuChart'), { type:'line', data:{labels:[],datasets:[]}, options:JSON.parse(JSON.stringify(baseOpts)) });
const ramChart = new Chart(document.getElementById('ramChart'), { type:'line', data:{labels:[],datasets:[]}, options:JSON.parse(JSON.stringify(baseOpts)) });

// ── ENSURE DATASET ──────────────────────────────
function ensureDataset(hostname) {
  if (hostDatasets[hostname]) return;
  const color = getColor(hostname);
  const makeDs = label => ({
    label: `${hostname}`,
    data:[], borderColor:color,
    backgroundColor:color+'18',
    borderWidth:2, fill:true, tension:0.35,
    pointRadius:0, pointHoverRadius:5
  });
  const cpuDs = makeDs(hostname+' CPU');
  const ramDs = makeDs(hostname+' RAM');
  hostDatasets[hostname] = { cpu:cpuDs, ram:ramDs };
  cpuChart.data.datasets.push(cpuDs);
  ramChart.data.datasets.push(ramDs);
  updateFilterDropdown();
}

// ── UPDATE CHARTS ────────────────────────────────
function pushMetric(metric) {
  const h = metric.hostname || 'unknown';
  ensureDataset(h);
  totalPoints++;

  // Shared labels
  const time = new Date(metric.timestamp || Date.now()).toLocaleTimeString('vi-VN');
  const labels = cpuChart.data.labels;

  if (!labels.length || labels[labels.length-1] !== time) {
    labels.push(time);
    ramChart.data.labels.push(time); // Thêm dòng này để cập nhật trục X cho RAM chart
    if (labels.length > MAX_PTS) {
      labels.shift();
      ramChart.data.labels.shift(); // Đồng bộ shift
    }
    // pad null for other hosts
    Object.keys(hostDatasets).forEach(k => {
      if (k !== h) {
        hostDatasets[k].cpu.data.push(null);
        hostDatasets[k].ram.data.push(null);
        if (hostDatasets[k].cpu.data.length > MAX_PTS) {
          hostDatasets[k].cpu.data.shift();
          hostDatasets[k].ram.data.shift();
        }
      }
    });
  }

  const ds = hostDatasets[h];
  ds.cpu.data.push(metric.cpu_usage);
  ds.ram.data.push(metric.ram_usage_percent);
  if (ds.cpu.data.length > MAX_PTS) { ds.cpu.data.shift(); ds.ram.data.shift(); }

  cpuChart.update('none');
  ramChart.update('none');

  // Update host state
  Object.assign(hostState[h], {
    cpu: metric.cpu_usage,
    ram: metric.ram_usage_percent,
    ramUsed: metric.ram_used,
    ramTotal: metric.ram_total,
    lastSeen: new Date()
  });

  updateHostCard(h);
  updateStats();
}

// ── HOST CARDS ───────────────────────────────────
function fmtBytes(b) {
  if (!b) return '?';
  const gb = b / 1073741824;
  return gb >= 1 ? gb.toFixed(1)+' GB' : (b/1048576).toFixed(0)+' MB';
}
function cpuColor(v) {
  if (v >= 85) return 'var(--red)';
  if (v >= 60) return 'var(--yellow)';
  return 'var(--green)';
}

function updateHostCard(hostname) {
  const st = hostState[hostname];
  if (!st) return;
  const show = selectedHost === 'all' || selectedHost === hostname;
  const cardId = 'hc-'+hostname.replace(/\W/g,'_');
  let card = document.getElementById(cardId);
  const grid = document.getElementById('hostGrid');

  // Remove empty state
  const empty = grid.querySelector('.empty-state');
  if (empty) empty.remove();

  if (!card) {
    card = document.createElement('div');
    card.className = 'host-card';
    card.id = cardId;
    grid.appendChild(card);
  }
  card.style.display = show ? '' : 'none';

  const cpu = st.cpu?.toFixed(1) ?? '--';
  const ram = st.ram?.toFixed(1) ?? '--';
  const ramInfo = st.ramTotal ? `${fmtBytes(st.ramUsed)} / ${fmtBytes(st.ramTotal)}` : '';
  const ago = st.lastSeen ? 'Just now' : '';

  card.innerHTML = `
    <div class="host-card-header">
      <div class="host-name">
        <div class="host-dot" style="background:${st.color}"></div>
        ${escHtml(hostname)}
      </div>
      <div class="host-time">${ago}</div>
    </div>
    <div class="meter-row">
      <div class="meter">
        <div class="meter-top">
          <span class="meter-label">CPU</span>
          <span class="meter-val" style="color:${cpuColor(st.cpu||0)}">${cpu}%</span>
        </div>
        <div class="meter-bar"><div class="meter-fill cpu" style="width:${cpu}%"></div></div>
      </div>
      <div class="meter">
        <div class="meter-top">
          <span class="meter-label">RAM ${ramInfo}</span>
          <span class="meter-val" style="color:var(--purple)">${ram}%</span>
        </div>
        <div class="meter-bar"><div class="meter-fill ram" style="width:${ram}%"></div></div>
      </div>
    </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── STATS ────────────────────────────────────────
function updateStats() {
  const hosts = Object.keys(hostState);
  document.getElementById('statHosts').textContent = hosts.length;
  document.getElementById('statPoints').textContent = totalPoints;
  if (!hosts.length) return;
  const avgCPU = hosts.reduce((s,h)=>s+(hostState[h].cpu||0),0)/hosts.length;
  const avgRAM = hosts.reduce((s,h)=>s+(hostState[h].ram||0),0)/hosts.length;
  document.getElementById('statCPU').textContent = avgCPU.toFixed(1)+'%';
  document.getElementById('statRAM').textContent = avgRAM.toFixed(1)+'%';
}

// ── FILTER ───────────────────────────────────────
function updateFilterDropdown() {
  const sel = document.getElementById('hostFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">All Hosts</option>';
  Object.keys(hostState).sort().forEach(h => {
    const opt = document.createElement('option');
    opt.value = h; opt.textContent = h;
    sel.appendChild(opt);
  });
  sel.value = cur && Object.keys(hostState).includes(cur) ? cur : 'all';
}

document.getElementById('hostFilter').addEventListener('change', e => {
  selectedHost = e.target.value;
  Object.keys(hostState).forEach(h => {
    const card = document.getElementById('hc-'+h.replace(/\W/g,'_'));
    if (card) card.style.display = (selectedHost==='all'||selectedHost===h)?'':'none';
  });
  // Toggle chart datasets visibility
  cpuChart.data.datasets.forEach((ds,i) => {
    const h = Object.keys(hostDatasets)[i];
    ds.hidden = selectedHost !== 'all' && h !== selectedHost;
  });
  ramChart.data.datasets.forEach((ds,i) => {
    const h = Object.keys(hostDatasets)[i];
    ds.hidden = selectedHost !== 'all' && h !== selectedHost;
  });
  cpuChart.update(); ramChart.update();
});

// ── WEBSOCKET ────────────────────────────────────
function setWS(connected) {
  const badge = document.getElementById('wsBadge');
  const text  = document.getElementById('wsText');
  badge.className = 'ws-badge ' + (connected ? 'connected' : 'disconnected');
  text.textContent = connected ? 'Live' : 'Reconnecting...';
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => { setWS(true); clearTimeout(reconnectTimer); };
  ws.onclose = () => { setWS(false); reconnectTimer = setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    try { pushMetric(JSON.parse(e.data)); } catch(_) {}
  };
}

// ── LOAD HISTORY ─────────────────────────────────
async function loadHistory() {
  try {
    const res = await fetch(API_URL+'?limit=120');
    if (!res.ok) return;
    const metrics = await res.json();
    if (!Array.isArray(metrics)) return;
    metrics.forEach(m => pushMetric(m));
  } catch(_) {}
}

// ── INIT ─────────────────────────────────────────
loadHistory();
connect();
</script>
</body>
</html>
